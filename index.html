<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYMOVER SAFEKEEPING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5E9',
                        primaryHover: '#0284C7'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header -->
        <div class="bg-primary px-8 py-6 text-white">
            <h1 class="text-2xl font-bold tracking-tight">SKYMOVER SAFEKEEPING</h1>
        </div>

        <!-- Form Body -->
        <form id="safekeepingForm" class="p-8 space-y-8">
            
            <div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Container Number</label>
                        <input type="text" id="containerNumber" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" placeholder="e.g., MSKU1234567">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Shipping Line</label>
                        <select id="ShippingLine" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none bg-white" onchange="toggleStorageRates()">
                            <option value="TS LINE">TS LINE</option>
                            <option value="EVERGREEN">EVERGREEN</option>
                            <option value="SINO TRANS">SINO TRANS</option>
                            <option value="ASL">ASL</option>
                            <option value="COSO">COSO</option>
                            <option value="ONE">ONE</option>
                            <option value="M-SC">M-SC</option>
                            <option value="HMM">HMM</option>
                            <option value="MAERKS">MAERKS</option>
                            <option value="CMA-CGM">CMA-CGM</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Trucking Name</label>
                        <select id="TruckingName" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none bg-white" onchange="toggleStorageRates()">
                            <option value="VTS">VTS</option>
                            <option value="GGS">GGS</option>
                            <option value="SKYMOVER">SKYMOVER</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">CNTR Type</label>
                        <select id="cntrType" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none bg-white" onchange="toggleStorageRates()">
                            <option value="1*20 Footer Dry">1*20 Footer Dry</option>
                            <option value="1*40 Footer Dry">1*40 Footer Dry</option>
                            <option value="1*20 Reefer Van">1*20 Reefer Van</option>
                            <option value="1*40 Reefer Van">1*40 Reefer Van</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Arrival Date</label>
                        <input type="date" id="arrivalDate" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" onchange="calculateStorageDays()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Checker Inspector</label>
                        <select id="CheckerInspector" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none bg-white" onchange="toggleStorageRates()">
                            <option value="Jr Ablaza">Jr Ablaza</option>
                            <option value="Jero Naval">Jero Naval</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Operator</label>
                        <select id="Operator" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none bg-white" onchange="toggleStorageRates()">
                            <option value="Roland">Roland</option>
                            <option value="Marvin">Marvin</option>
                            <option value="Mariel">Mariel</option>
                            <option value="Jomar">Jomar</option>
                            <option value="Joseph">Joseph</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Van In Amount</label>
                        <input type="number" id="vanInAmount" step="0.01" min="0" value="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" oninput="calculateTotals()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Van Out Amount</label>
                        <input type="number" id="vanOutAmount" step="0.01" min="0" value="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" oninput="calculateTotals()">
                    </div>
                    <div id="reeferRateBox" class="hidden">
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Storage Fee Reefer Van (Daily)</label>
                        <input type="number" id="storageFeeReefer" step="0.01" min="0" value="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" oninput="calculateTotals()">
                    </div>
                    <!-- Rates -->
                    <div id="dryRateBox">
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Storage Fee Dry Van (Daily)</label>
                        <input type="number" id="storageFeeDry" step="0.01" min="0" value="0" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" oninput="calculateTotals()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Storage Days (Auto)</label>
                        <input type="number" id="storageDays" readonly class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-100 font-bold text-slate-700" value="0">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Pull Out Date</label>
                        <input type="date" id="pullOutDate" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" onchange="calculateStorageDays()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Storage Amount (Auto)</label>
                        <input type="text" id="storageAmountDisplay" readonly class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-100 font-bold text-slate-700" value="₱0.00">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Location CY 1</label>
                        <input type="text" id="locationCY1" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" placeholder="Primary CY">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Location Area CY 1</label>
                        <input type="text" id="locationAreaCY1" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" placeholder="Area / Slot 1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Location CY 2 (Optional)</label>
                        <input type="text" id="locationCY2" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" placeholder="Secondary CY">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Location Area CY 2 (Optional)</label>
                        <input type="text" id="locationAreaCY2" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" placeholder="Area / Slot 2">
                    </div>            
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Equipment Type</label>
                        <input type="text" id="equipmentType" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none" placeholder="e.g., 40HC">
                    </div>
            </div>

                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-sky-600">Total Amount Bill</span>
                        <div id="totalAmountDisplay" class="text-3xl font-extrabold text-slate-800">₱0.00</div>
                    </div>
                    <div class="mt-4 md:mt-0">
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Attachment Photo / Gate Pass</label>
                        <input type="file" id="attachmentPhoto" accept="image/*" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-sky-100 file:text-primary hover:file:bg-sky-200 cursor-pointer">
                    </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white font-medium py-3 rounded-lg shadow-md transition duration-200 text-lg">
                Save Safekeeping Record
            </button>
        </form>
    </div>

    <!-- JavaScript Automation -->
    <script>
        function toggleStorageRates() {
            const type = document.getElementById('cntrType').value;
            const dryBox = document.getElementById('dryRateBox');
            const reeferBox = document.getElementById('reeferRateBox');

            if (type === 'Reefer') {
                dryBox.classList.add('hidden');
                reeferBox.classList.remove('hidden');
                document.getElementById('storageFeeDry').value = 0;
            } else {
                reeferBox.classList.add('hidden');
                dryBox.classList.remove('hidden');
                document.getElementById('storageFeeReefer').value = 0;
            }
            calculateTotals();
        }

        function calculateStorageDays() {
            const arrival = document.getElementById('arrivalDate').value;
            const pullout = document.getElementById('pullOutDate').value;

            if (arrival && pullout) {
                const date1 = new Date(arrival);
                const date2 = new Date(pullout);
                const diffTime = date2 - date1;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                document.getElementById('storageDays').value = diffDays > 0 ? diffDays : 0;
            } else {
                document.getElementById('storageDays').value = 0;
            }
            calculateTotals();
        }

        function calculateTotals() {
            const days = parseFloat(document.getElementById('storageDays').value) || 0;
            const cntrType = document.getElementById('cntrType').value;
            
            let dailyRate = 0;
            if (cntrType === 'Reefer') {
                dailyRate = parseFloat(document.getElementById('storageFeeReefer').value) || 0;
            } else {
                dailyRate = parseFloat(document.getElementById('storageFeeDry').value) || 0;
            }

            const storageTotal = days * dailyRate;
            const vanIn = parseFloat(document.getElementById('vanInAmount').value) || 0;
            const vanOut = parseFloat(document.getElementById('vanOutAmount').value) || 0;

            const grandTotal = storageTotal + vanIn + vanOut;

            // Update displays
            document.getElementById('storageAmountDisplay').innerText = '₱' + storageTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('totalAmountDisplay').innerText = '₱' + grandTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        document.getElementById('safekeepingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('SKYMOVER SAFEKEEPING record processed successfully with auto-computed billing!');
        });
    </script>
</body>
</html>
