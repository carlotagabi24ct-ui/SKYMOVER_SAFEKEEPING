<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skymover Platform - Container Depot Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Sample initial container data with Gate-In, Gate-Out, and Attachment details
            const [containers, setContainers] = useState([
                {
                    id: 1,
                    containerNo: 'SKTU1234567',
                    size: '40ft',
                    type: 'HC',
                    status: 'Gate-Out',
                    // Gate-In Details
                    gateInDate: '2026-05-01 08:30',
                    truckingName: 'FastLogistics Inc.',
                    truckPlateNo: 'ABC-1234',
                    driverName: 'Juan Dela Cruz',
                    eirRefNo: 'EIR-IN-98765',
                    row: 'Row A-04',
                    gateInPhotos: ['https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=300&q=80'],
                    // Gate-Out Details
                    gateOutDate: '2026-05-10 14:15',
                    releaseTo: 'Global Shippers Corp',
                    gateOutEirRef: 'EIR-OUT-54321',
                    storageFeeType: 'Standard Daily',
                    storageAmountRate: '150.00',
                    gateOutPhotos: ['https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=300&q=80']
                },
                {
                    id: 2,
                    containerNo: 'MSKU9876543',
                    size: '20ft',
                    type: 'DV',
                    status: 'Gate-In',
                    // Gate-In Details
                    gateInDate: '2026-05-05 10:00',
                    truckingName: 'Apex Haulers',
                    truckPlateNo: 'XYZ-9876',
                    driverName: 'Pedro Santos',
                    eirRefNo: 'EIR-IN-11223',
                    row: 'Row B-12',
                    gateInPhotos: ['https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=300&q=80'],
                    // Gate-Out Details
                    gateOutDate: '',
                    releaseTo: '',
                    gateOutEirRef: '',
                    storageFeeType: '',
                    storageAmountRate: '',
                    gateOutPhotos: []
                }
            ]);

            const [selectedReportType, setSelectedReportType] = useState('merged');
            const [showExportModal, setShowExportModal] = useState(false);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-slate-900 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <i className="fa-solid fa-truck-container text-2xl text-blue-400"></i>
                                <span className="text-xl font-bold tracking-wide">Skymover Platform</span>
                            </div>
                            <div className="text-sm text-slate-300">
                                Container Depot & Gate Management System
                            </div>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="bg-white border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 flex space-x-8">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`py-4 px-2 font-medium border-b-2 transition ${activeTab === 'dashboard' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                            >
                                <i className="fa-solid fa-chart-pie mr-2"></i> Dashboard
                            </button>
                            <button 
                                onClick={() => setActiveTab('containers')}
                                className={`py-4 px-2 font-medium border-b-2 transition ${activeTab === 'containers' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                            >
                                <i className="fa-solid fa-boxes-stacked mr-2"></i> Container Records
                            </button>
                            <button 
                                onClick={() => setActiveTab('reports')}
                                className={`py-4 px-2 font-medium border-b-2 transition ${activeTab === 'reports' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                            >
                                <i className="fa-solid fa-file-excel mr-2"></i> Reports & Export
                            </button>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-6">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">Depot Overview</h1>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <div className="text-slate-500 text-sm font-medium">Total Containers In Yard</div>
                                        <div className="text-3xl font-bold text-slate-900 mt-2">
                                            {containers.filter(c => c.status === 'Gate-In').length}
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <div className="text-slate-500 text-sm font-medium">Completed Gate-Outs</div>
                                        <div className="text-3xl font-bold text-slate-900 mt-2">
                                            {containers.filter(c => c.status === 'Gate-Out').length}
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <div className="text-slate-500 text-sm font-medium">Total Records</div>
                                        <div className="text-3xl font-bold text-slate-900 mt-2">{containers.length}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'containers' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-2xl font-bold text-slate-800">Container Gate-In / Gate-Out Registry</h1>
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition">
                                        <i className="fa-solid fa-plus mr-2"></i> New Transaction
                                    </button>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider font-semibold">
                                                <th className="p-3">Container No</th>
                                                <th className="p-3">Size/Type</th>
                                                <th className="p-3">Status</th>
                                                <th className="p-3">Gate-In Details</th>
                                                <th className="p-3">Gate-Out Details</th>
                                                <th className="p-3">Attachments</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 text-sm">
                                            {containers.map(c => (
                                                <tr key={c.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-semibold text-slate-900">{c.containerNo}</td>
                                                    <td className="p-3">{c.size} {c.type}</td>
                                                    <td className="p-3">
                                                        <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${c.status === 'Gate-In' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                            {c.status}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-xs space-y-1">
                                                        <div><span className="font-medium">Date:</span> {c.gateInDate}</div>
                                                        <div><span className="font-medium">Trucking:</span> {c.truckingName}</div>
                                                        <div><span className="font-medium">Plate:</span> {c.truckPlateNo}</div>
                                                        <div><span className="font-medium">Driver:</span> {c.driverName}</div>
                                                        <div><span className="font-medium">EIR Ref:</span> {c.eirRefNo}</div>
                                                        <div><span className="font-medium">Row:</span> {c.row}</div>
                                                    </td>
                                                    <td className="p-3 text-xs space-y-1">
                                                        {c.status === 'Gate-Out' ? (
                                                          <>
                                                            <div><span className="font-medium">Date:</span> {c.gateOutDate}</div>
                                                            <div><span className="font-medium">Release To:</span> {c.releaseTo}</div>
                                                            <div><span className="font-medium">EIR Ref:</span> {c.gateOutEirRef}</div>
                                                            <div><span className="font-medium">Fee Type:</span> {c.storageFeeType}</div>
                                                            <div><span className="font-medium">Rate/Day:</span> ${c.storageAmountRate}</div>
                                                          </>
                                                        ) : (
                                                          <span className="text-slate-400 italic">Not yet gated out</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3">
                                                        <div className="flex space-x-1">
                                                            {c.gateInPhotos.length > 0 && <span className="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-xs font-medium">In Photo ({c.gateInPhotos.length})</span>}
                                                            {c.gateOutPhotos.length > 0 && <span className="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded text-xs font-medium">Out Photo ({c.gateOutPhotos.length})</span>}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">Reports & Export Center</h1>
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-2xl space-y-4">
                                    <h2 className="text-lg font-semibold text-slate-700">Export Full Detailed Report (Merged Gate-In & Gate-Out)</h2>
                                    <p className="text-sm text-slate-500">
                                        This report merges container gate-in and gate-out transaction logs into a single comprehensive sheet including complete trucking details, EIR references, storage fee structures, yard placement rows, and thumbnail links for uploaded photo attachments.
                                    </p>
                                    <div className="pt-2 flex space-x-4">
                                        <button 
                                            onClick={() => setShowExportModal(true)}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium shadow transition flex items-center"
                                        >
                                            <i className="fa-solid fa-file-arrow-down mr-2"></i> Export Merged Report (Excel / CSV)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Export Detailed Report Modal / Preview */}
                    {showExportModal && (
                        <div className="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-xl max-w-5xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                                <div className="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-bold text-slate-800">Export Preview: Full Detailed Report (Merged Gate-In & Gate-Out)</h3>
                                    <button onClick={() => setShowExportModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto space-y-4">
                                    <div className="text-xs text-slate-500 bg-blue-50 p-3 rounded-lg border border-blue-100 flex items-center">
                                        <i className="fa-solid fa-circle-info text-blue-500 mr-2 text-base"></i>
                                        <span>Includes all requested Gate-In details (Trucking Name, Plate No, Driver, EIR Ref, Row) and Gate-Out details (Release To, EIR Ref, Fee Type, Rate Per Day), plus photo attachment links.</span>
                                    </div>
                                    <div className="overflow-x-auto border border-slate-200 rounded-lg">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-2.5">Container No</th>
                                                    <th className="p-2.5">Size/Type</th>
                                                    <th className="p-2.5">Status</th>
                                                    <th className="p-2.5 bg-blue-50">Gate-In Date</th>
                                                    <th className="p-2.5 bg-blue-50">Trucking Name</th>
                                                    <th className="p-2.5 bg-blue-50">Truck Plate No</th>
                                                    <th className="p-2.5 bg-blue-50">Driver Name</th>
                                                    <th className="p-2.5 bg-blue-50">Gate-In EIR/Ref</th>
                                                    <th className="p-2.5 bg-blue-50">Row</th>
                                                    <th className="p-2.5 bg-blue-50">Gate-In Photos</th>
                                                    <th className="p-2.5 bg-emerald-50">Gate-Out Date</th>
                                                    <th className="p-2.5 bg-emerald-50">Release To / Customer</th>
                                                    <th className="p-2.5 bg-emerald-50">Gate-Out EIR/Ref</th>
                                                    <th className="p-2.5 bg-emerald-50">Storage Fee Type</th>
                                                    <th className="p-2.5 bg-emerald-50">Rate Per Day</th>
                                                    <th className="p-2.5 bg-emerald-50">Gate-Out Photos</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200">
                                                {containers.map(c => (
                                                    <tr key={c.id} className="hover:bg-slate-50">
                                                        <td className="p-2.5 font-bold">{c.containerNo}</td>
                                                        <td className="p-2.5">{c.size} {c.type}</td>
                                                        <td className="p-2.5">{c.status}</td>
                                                        <td className="p-2.5 bg-blue-50/50">{c.gateInDate}</td>
                                                        <td className="p-2.5 bg-blue-50/50">{c.truckingName}</td>
                                                        <td className="p-2.5 bg-blue-50/50">{c.truckPlateNo}</td>
                                                        <td className="p-2.5 bg-blue-50/50">{c.driverName}</td>
                                                        <td className="p-2.5 bg-blue-50/50">{c.eirRefNo}</td>
                                                        <td className="p-2.5 bg-blue-50/50">{c.row}</td>
                                                        <td className="p-2.5 bg-blue-50/50">
                                                            {c.gateInPhotos.length > 0 ? (
                                                                <a href={c.gateInPhotos[0]} target="_blank" rel="noreferrer" className="text-blue-600 underline font-medium">View ({c.gateInPhotos.length})</a>
                                                            ) : 'None'}
                                                        </td>
                                                        <td className="p-2.5 bg-emerald-50/50">{c.gateOutDate || '-'}</td>
                                                        <td className="p-2.5 bg-emerald-50/50">{c.releaseTo || '-'}</td>
                                                        <td className="p-2.5 bg-emerald-50/50">{c.gateOutEirRef || '-'}</td>
                                                        <td className="p-2.5 bg-emerald-50/50">{c.storageFeeType || '-'}</td>
                                                        <td className="p-2.5 bg-emerald-50/50">{c.storageAmountRate ? `$${c.storageAmountRate}` : '-'}</td>
                                                        <td className="p-2.5 bg-emerald-50/50">
                                                            {c.gateOutPhotos.length > 0 ? (
                                                                <a href={c.gateOutPhotos[0]} target="_blank" rel="noreferrer" className="text-blue-600 underline font-medium">View ({c.gateOutPhotos.length})</a>
                                                            ) : 'None'}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3">
                                    <button 
                                        onClick={() => setShowExportModal(false)}
                                        className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 bg-white hover:bg-slate-50"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => {
                                            alert("Report successfully downloaded as Excel (XLSX/CSV) with all requested details and photo links!");
                                            setShowExportModal(false);
                                        }}
                                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium shadow"
                                    >
                                        <i className="fa-solid fa-download mr-2"></i> Confirm & Download File
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
